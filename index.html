
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rave Crush | Coquette Edition</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND DECORATIONS -->
    <div class="sakura"></div>
    <div class="overlay"></div>

    <!-- GAME TITLE -->
    <h1>🎀 Rave Crush 🌸</h1>

    <!-- SCORE / TIMER / BEST -->
    <div class="top-ui">

        <div class="ui-box">
            SCORE
            <span id="score">0</span>
        </div>

        <div class="ui-box">
            TIME
            <span id="timer">16</span>
        </div>

        <div class="ui-box">
            BEST
            <span id="highScore">0</span>
        </div>

    </div>

    <!-- GAME CONTROLS -->
    <div class="controls">

        <button id="pauseBtn">
            ⏸ PAUSE
        </button>

        <button onclick="exitGame()">
            ♡ EXIT
        </button>

    </div>

    <!-- GAME BOARD -->
    <div id="board"></div>

    <!-- START SCREEN -->
    <div id="startScreen">

        <h2>🎀 MYTHIC CRUSH 🌸</h2>

        <p>
            Match your favorite tiles
            and beat your best score!
        </p>

        <button onclick="startCountdown()">
            ♡ PLAY ♡
        </button>

    </div>

    <!-- COUNTDOWN SCREEN -->
    <div id="countdownScreen">

        <span id="countdownText">3</span>

    </div>

    <!-- GAME OVER SCREEN -->
    <div id="gameOver">

        <h2>GAME OVER ♡</h2>

        <p>
            Final Score:
            <span id="finalScore">0</span>
        </p>

        <button onclick="restartGame()">
            🎀 PLAY AGAIN
        </button>

    </div>

    <!-- JAVASCRIPT -->
    <script src="script.js"></script>

</body>
</html>
